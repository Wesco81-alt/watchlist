<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Watchlist-Kurator</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #162032;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #f87171;
      --border: rgba(148, 163, 184, 0.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    h1 { font-size: 1.15rem; margin: 0; }
    .badge {
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--accent);
      white-space: nowrap;
    }
    .badge.active {
      color: var(--accent-2);
      border-color: rgba(34, 197, 94, 0.4);
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      gap: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .card h2 {
      font-size: 1rem;
      margin: 0 0 12px;
    }
    .row {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 640px) {
      .row.two { grid-template-columns: 1fr 1fr; }
      .row.add { grid-template-columns: 2fr 1fr 1fr auto; }
      .row.filters { grid-template-columns: 1fr 1fr; }
    }
    input, select, button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 10px 12px;
      background: var(--panel-2);
      color: var(--text);
    }
    button {
      background: var(--accent);
      color: #06202e;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    button.secondary {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.danger {
      background: rgba(248, 113, 113, 0.16);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.35);
    }
    .list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }
    .item {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .provider-pill {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      margin-left: 8px;
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .meta {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .status-msg {
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--muted);
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header>
    <h1>Watchlist-Kurator</h1>
    <span id="apiStatus" class="badge">Demo-Modus</span>
  </header>

  <main>
    <section class="card">
      <h2>Titel zur Merkliste hinzufügen</h2>
      <form id="addForm" class="row add">
        <input id="titleInput" type="text" placeholder="Film, Serie oder Doku eingeben..." required />
        <select id="providerInput" aria-label="Anbieter">
          <option value="Sky">Sky</option>
          <option value="Netflix">Netflix</option>
          <option value="ARD">ARD</option>
          <option value="ZDF">ZDF</option>
          <option value="Tresat">Tresat</option>
          <option value="Joyn">Joyn</option>
          <option value="Netzkino">Netzkino</option>
          <option value="Prime Video">Prime Video</option>
          <option value="HBO Max">HBO Max</option>
          <option value="Apple TV">Apple TV</option>
          <option value="Rakuten TV">Rakuten TV</option>
          <option value="Sonstiges">Sonstiges</option>
        </select>
        <select id="statusInput" aria-label="Status">
          <option value="Geplant">Geplant</option>
          <option value="Läuft">Läuft</option>
          <option value="Gesehen">Gesehen</option>
        </select>
        <button type="submit">Hinzufügen</button>
      </form>

      <div class="row filters" style="margin-top: 12px;">
        <select id="providerFilter" aria-label="Nach Anbieter filtern">
          <option value="Alle">Alle Anbieter</option>
          <option value="Sky">Sky</option>
          <option value="Netflix">Netflix</option>
          <option value="ARD">ARD</option>
          <option value="ZDF">ZDF</option>
          <option value="Tresat">Tresat</option>
          <option value="Joyn">Joyn</option>
          <option value="Netzkino">Netzkino</option>
          <option value="Prime Video">Prime Video</option>
          <option value="HBO Max">HBO Max</option>
          <option value="Apple TV">Apple TV</option>
          <option value="Rakuten TV">Rakuten TV</option>
          <option value="Sonstiges">Sonstiges</option>
        </select>
        <select id="statusFilter" aria-label="Nach Status filtern">
          <option value="Alle">Alle Status</option>
          <option value="Geplant">Geplant</option>
          <option value="Läuft">Läuft</option>
          <option value="Gesehen">Gesehen</option>
        </select>
      </div>

      <div class="list" id="watchlistContainer"></div>
    </section>

    <section class="card">
      <h2>KI-Empfehlung (Gemini)</h2>
      <div class="row two">
        <input id="moodInput" type="text" placeholder="Stimmung / Genre (z. B. Thriller, Sci-Fi, Doku)" />
        <button id="recommendBtn" type="button">Empfehlung vorschlagen</button>
      </div>
      <div id="aiOutput" class="status-msg">Trage unten deinen Gemini API-Key ein, um personalisierte Vorschläge zu erhalten.</div>
    </section>

    <section class="card">
      <h2>Daten &amp; API</h2>
      <div class="row two">
        <input id="apiKeyInput" type="password" placeholder="Gemini API-Key (lokal gespeichert)" autocomplete="off" />
        <div class="actions">
          <button id="saveKeyBtn" type="button">Key speichern</button>
          <button id="clearKeyBtn" type="button" class="secondary">Key löschen</button>
        </div>
      </div>
      <div id="keyHint" class="status-msg">Der API-Key wird ausschließlich im lokalen Speicher (localStorage) deines Browsers abgelegt.</div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "watchlist_kurator_items_v3";
    const API_KEY_STORAGE = "watchlist_kurator_gemini_key_v1";
    const PROVIDERS = [
      "Sky",
      "Netflix",
      "ARD",
      "ZDF",
      "Tresat",
      "Joyn",
      "Netzkino",
      "Prime Video",
      "HBO Max",
      "Apple TV",
      "Rakuten TV",
      "Sonstiges"
    ];
    const STATUSES = ["Geplant", "Läuft", "Gesehen"];

    let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    if (!Array.isArray(items) || items.length === 0) {
      items = [
        { id: crypto.randomUUID(), title: "Dark", provider: "Netflix", status: "Geplant" },
        { id: crypto.randomUUID(), title: "Tatort", provider: "ARD", status: "Läuft" }
      ];
      saveItems();
    }

    const watchlistContainer = document.getElementById("watchlistContainer");
    const addForm = document.getElementById("addForm");
    const titleInput = document.getElementById("titleInput");
    const providerInput = document.getElementById("providerInput");
    const statusInput = document.getElementById("statusInput");
    const providerFilter = document.getElementById("providerFilter");
    const statusFilter = document.getElementById("statusFilter");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const saveKeyBtn = document.getElementById("saveKeyBtn");
    const clearKeyBtn = document.getElementById("clearKeyBtn");
    const apiStatus = document.getElementById("apiStatus");
    const moodInput = document.getElementById("moodInput");
    const recommendBtn = document.getElementById("recommendBtn");
    const aiOutput = document.getElementById("aiOutput");

    function saveItems() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function getApiKey() {
      return (localStorage.getItem(API_KEY_STORAGE) || "").trim();
    }

    function updateApiBadge() {
      const hasKey = Boolean(getApiKey());
      apiStatus.textContent = hasKey ? "Gemini aktiv" : "Demo-Modus";
      apiStatus.classList.toggle("active", hasKey);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[m]));
    }

    function renderList() {
      const selectedProvider = providerFilter.value;
      const selectedStatus = statusFilter.value;

      const filtered = items.filter((item) => {
        const providerMatch = selectedProvider === "Alle" || item.provider === selectedProvider;
        const statusMatch = selectedStatus === "Alle" || item.status === selectedStatus;
        return providerMatch && statusMatch;
      });

      watchlistContainer.innerHTML = "";
      if (filtered.length === 0) {
        watchlistContainer.innerHTML = '<div class="meta">Keine Einträge für den gewählten Filter vorhanden.</div>';
        return;
      }

      filtered.forEach((item) => {
        const providerName = PROVIDERS.includes(item.provider) ? item.provider : "Sonstiges";
        const currentStatus = STATUSES.includes(item.status) ? item.status : "Geplant";

        const div = document.createElement("div");
        div.className = "item";

        const info = document.createElement("div");
        info.innerHTML = `
          <div>
            <strong>${escapeHtml(item.title)}</strong>
            <span class="provider-pill">${escapeHtml(providerName)}</span>
          </div>
          <div class="meta">Status: ${escapeHtml(currentStatus)}</div>
        `;

        const actions = document.createElement("div");
        actions.className = "actions";

        const nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.className = "secondary";
        nextBtn.textContent = "Status wechseln";
        nextBtn.addEventListener("click", () => {
          const next = STATUSES[(STATUSES.indexOf(currentStatus) + 1) % STATUSES.length];
          item.status = next;
          saveItems();
          renderList();
        });

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "danger";
        delBtn.textContent = "Löschen";
        delBtn.addEventListener("click", () => {
          items = items.filter((entry) => entry.id !== item.id);
          saveItems();
          renderList();
        });

        actions.append(nextBtn, delBtn);
        div.append(info, actions);
        watchlistContainer.append(div);
      });
    }

    addForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const title = titleInput.value.trim();
      if (!title) return;
      items.unshift({
        id: crypto.randomUUID(),
        title,
        provider: providerInput.value,
        status: statusInput.value
      });
      saveItems();
      renderList();
      titleInput.value = "";
      titleInput.focus();
    });

    providerFilter.addEventListener("change", renderList);
    statusFilter.addEventListener("change", renderList);

    saveKeyBtn.addEventListener("click", () => {
      const val = apiKeyInput.value.trim();
      if (!val) return;
      localStorage.setItem(API_KEY_STORAGE, val);
      apiKeyInput.value = "";
      updateApiBadge();
      aiOutput.textContent = "API-Key lokal gespeichert. Du kannst jetzt eine Empfehlung anfordern.";
    });

    clearKeyBtn.addEventListener("click", () => {
      localStorage.removeItem(API_KEY_STORAGE);
      apiKeyInput.value = "";
      updateApiBadge();
      aiOutput.textContent = "Gespeicherter API-Key entfernt.";
    });

    recommendBtn.addEventListener("click", async () => {
      const key = getApiKey();
      const mood = moodInput.value.trim() || "abwechslungsreich";
      const titles = items.map((i) => `${i.title} [${i.provider || "Sonstiges"}, ${i.status}]`).join(", ");

      if (!key) {
        aiOutput.textContent = `Demo-Hinweis: Für die Merkliste (${titles || "leer"}) wäre ein guter nächster Titel im Bereich „${mood}“ ein passender Film oder eine Serie mit starker Atmosphäre. Für echte Gemini-Antworten bitte oben unter „Daten & API“ einen Key speichern.`;
        return;
      }

      aiOutput.textContent = "Frage Gemini an...";
      try {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${encodeURIComponent(key)}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{
                parts: [{
                  text: `Du bist ein hilfreicher Watchlist-Kurator. Aktuelle Merkliste: ${titles || "keine Einträge"}. Wunsch/Stimmung: ${mood}. Gib auf Deutsch 3 kurze, konkrete Empfehlungen mit jeweils 1 Satz Begründung.`
                }]
              }]
            })
          }
        );
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data?.error?.message || `HTTP ${res.status}`);
        }
        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || "Keine Antwort erhalten.";
        aiOutput.textContent = text.trim();
      } catch (err) {
        aiOutput.textContent = `Fehler bei der Gemini-Anfrage: ${err.message}`;
      }
    });

    updateApiBadge();
    renderList();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Watchlist-Kurator</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #162032;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --super: #f59e0b;
      --danger: #f87171;
      --border: rgba(148, 163, 184, 0.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    h1 { font-size: 1.15rem; margin: 0; }
    .badge {
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--accent);
      white-space: nowrap;
    }
    .badge.active {
      color: var(--accent-2);
      border-color: rgba(34, 197, 94, 0.4);
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      gap: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .card h2 {
      font-size: 1rem;
      margin: 0 0 12px;
    }
    .cluster-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--accent);
      margin: 14px 0 8px;
    }
    .row {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 640px) {
      .row.two { grid-template-columns: 1fr 1fr; }
      .row.add { grid-template-columns: 2fr 1fr 1fr auto; }
      .row.filters { grid-template-columns: 1fr 1fr 1fr; }
    }
    input, select, textarea, button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 10px 12px;
      background: var(--panel-2);
      color: var(--text);
    }
    button {
      background: var(--accent);
      color: #06202e;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    button.secondary {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.danger {
      background: rgba(248, 113, 113, 0.16);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.35);
    }
    button.success {
      background: rgba(34, 197, 94, 0.18);
      color: var(--accent-2);
      border: 1px solid rgba(34, 197, 94, 0.35);
    }
    .rating-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    .rate-btn {
      padding: 6px 10px;
      font-size: 0.82rem;
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      font-weight: 600;
    }
    .rate-btn.selected-dislike {
      background: rgba(248, 113, 113, 0.2);
      color: var(--danger);
      border-color: rgba(248, 113, 113, 0.5);
    }
    .rate-btn.selected-like {
      background: rgba(56, 189, 248, 0.2);
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.5);
    }
    .rate-btn.selected-super {
      background: rgba(245, 158, 11, 0.22);
      color: var(--super);
      border-color: rgba(245, 158, 11, 0.55);
    }
    .list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }
    .item {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .rec-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: grid;
      gap: 8px;
      margin-bottom: 10px;
    }
    .rec-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .provider-pill {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      margin-left: 8px;
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .rating-pill {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      margin-left: 6px;
      background: rgba(245, 158, 11, 0.14);
      color: var(--super);
      border: 1px solid rgba(245, 158, 11, 0.32);
    }
    .meta {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .status-msg {
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--muted);
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header>
    <h1>Watchlist-Kurator</h1>
    <span id="apiStatus" class="badge">Demo-Modus</span>
  </header>

  <main>
    <section class="card">
      <h2>Titel zur Merkliste hinzufügen</h2>
      <form id="addForm" class="row add">
        <input id="titleInput" type="text" placeholder="Film, Serie oder Doku eingeben..." required />
        <select id="providerInput" aria-label="Anbieter">
          <option value="Sky">Sky</option>
          <option value="Netflix">Netflix</option>
          <option value="ARD">ARD</option>
          <option value="ZDF">ZDF</option>
          <option value="Tresat">Tresat</option>
          <option value="Joyn">Joyn</option>
          <option value="Netzkino">Netzkino</option>
          <option value="Prime Video">Prime Video</option>
          <option value="HBO Max">HBO Max</option>
          <option value="Apple TV">Apple TV</option>
          <option value="Rakuten TV">Rakuten TV</option>
          <option value="Sonstiges">Sonstiges</option>
        </select>
        <select id="statusInput" aria-label="Status">
          <option value="Geplant">Geplant</option>
          <option value="Läuft">Läuft</option>
          <option value="Gesehen">Gesehen</option>
        </select>
        <button type="submit">Hinzufügen</button>
      </form>

      <div class="row filters" style="margin-top: 12px;">
        <select id="providerFilter" aria-label="Nach Anbieter filtern">
          <option value="Alle">Alle Anbieter</option>
          <option value="Sky">Sky</option>
          <option value="Netflix">Netflix</option>
          <option value="ARD">ARD</option>
          <option value="ZDF">ZDF</option>
          <option value="Tresat">Tresat</option>
          <option value="Joyn">Joyn</option>
          <option value="Netzkino">Netzkino</option>
          <option value="Prime Video">Prime Video</option>
          <option value="HBO Max">HBO Max</option>
          <option value="Apple TV">Apple TV</option>
          <option value="Rakuten TV">Rakuten TV</option>
          <option value="Sonstiges">Sonstiges</option>
        </select>
        <select id="statusFilter" aria-label="Nach Status filtern">
          <option value="Alle">Alle Status</option>
          <option value="Geplant">Geplant</option>
          <option value="Läuft">Läuft</option>
          <option value="Gesehen">Gesehen</option>
        </select>
        <select id="ratingFilter" aria-label="Nach Bewertung filtern">
          <option value="Alle">Alle Bewertungen</option>
          <option value="Finde ich super">Finde ich super</option>
          <option value="Gefällt mir">Gefällt mir</option>
          <option value="Nicht gefällt mir">Nicht gefällt mir</option>
          <option value="Ohne Bewertung">Ohne Bewertung</option>
        </select>
      </div>

      <div class="list" id="watchlistContainer"></div>
    </section>

    <section class="card">
      <h2>KI-Empfehlung (Gemini)</h2>
      <div class="row two">
        <input id="moodInput" type="text" placeholder="Stimmung / Genre (z. B. Thriller, Sci-Fi, Doku)" />
        <button id="recommendBtn" type="button">Empfehlung vorschlagen</button>
      </div>
      <div id="aiStatus" class="status-msg">Trage unten deinen Gemini API-Key ein, um personalisierte Vorschläge zu erhalten.</div>
      <div id="aiRecommendations"></div>
    </section>

    <section class="card">
      <h2>Daten &amp; API</h2>
      <div class="row two">
        <input id="apiKeyInput" type="password" placeholder="Gemini API-Key (lokal gespeichert)" autocomplete="off" />
        <div class="actions">
          <button id="saveKeyBtn" type="button">Key speichern</button>
          <button id="clearKeyBtn" type="button" class="secondary">Key löschen</button>
        </div>
      </div>
      <div id="keyHint" class="status-msg">Der API-Key wird ausschließlich im lokalen Speicher (localStorage) deines Browsers abgelegt.</div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "watchlist_kurator_items_v4";
    const API_KEY_STORAGE = "watchlist_kurator_gemini_key_v1";
    const GEMINI_MODELS = ["gemini-3.8-flash", "gemini-3.5-flash", "gemini-3.1-flash-lite"];
    const PROVIDERS = [
      "Sky",
      "Netflix",
      "ARD",
      "ZDF",
      "Tresat",
      "Joyn",
      "Netzkino",
      "Prime Video",
      "HBO Max",
      "Apple TV",
      "Rakuten TV",
      "Sonstiges"
    ];
    const STATUSES = ["Geplant", "Läuft", "Gesehen"];
    const RATINGS = ["Nicht gefällt mir", "Gefällt mir", "Finde ich super"];

    let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    if (!Array.isArray(items) || items.length === 0) {
      items = [
        { id: crypto.randomUUID(), title: "Dark", provider: "Netflix", status: "Geplant", rating: "Finde ich super" },
        { id: crypto.randomUUID(), title: "Tatort", provider: "ARD", status: "Läuft", rating: "Gefällt mir" }
      ];
      saveItems();
    }

    const watchlistContainer = document.getElementById("watchlistContainer");
    const addForm = document.getElementById("addForm");
    const titleInput = document.getElementById("titleInput");
    const providerInput = document.getElementById("providerInput");
    const statusInput = document.getElementById("statusInput");
    const providerFilter = document.getElementById("providerFilter");
    const statusFilter = document.getElementById("statusFilter");
    const ratingFilter = document.getElementById("ratingFilter");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const saveKeyBtn = document.getElementById("saveKeyBtn");
    const clearKeyBtn = document.getElementById("clearKeyBtn");
    const apiStatus = document.getElementById("apiStatus");
    const moodInput = document.getElementById("moodInput");
    const recommendBtn = document.getElementById("recommendBtn");
    const aiStatus = document.getElementById("aiStatus");
    const aiRecommendations = document.getElementById("aiRecommendations");

    function saveItems() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function getApiKey() {
      return (localStorage.getItem(API_KEY_STORAGE) || "").trim();
    }

    function updateApiBadge() {
      const hasKey = Boolean(getApiKey());
      apiStatus.textContent = hasKey ? "Gemini aktiv" : "Demo-Modus";
      apiStatus.classList.toggle("active", hasKey);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[m]));
    }

    function stripMarkdown(str) {
      return String(str).replace(/\*\*/g, "").replace(/\*/g, "").trim();
    }

    function normalizeProvider(raw) {
      if (!raw) return "Sonstiges";
      const match = PROVIDERS.find((p) => p.toLowerCase() === String(raw).trim().toLowerCase());
      return match || "Sonstiges";
    }

    function addToWatchlist(title, provider, rating = null) {
      const cleanTitle = stripMarkdown(title);
      if (!cleanTitle) return;
      items.unshift({
        id: crypto.randomUUID(),
        title: cleanTitle,
        provider: normalizeProvider(provider),
        status: "Geplant",
        rating: RATINGS.includes(rating) ? rating : null
      });
      saveItems();
      renderList();
    }

    function setItemRating(item, nextRating) {
      item.rating = item.rating === nextRating ? null : nextRating;
      saveItems();
      renderList();
    }

    function createRatingControls(currentRating, onSelect) {
      const group = document.createElement("div");
      group.className = "rating-group";

      const configs = [
        { value: "Nicht gefällt mir", label: "Nicht gefällt mir", activeClass: "selected-dislike" },
        { value: "Gefällt mir", label: "Gefällt mir", activeClass: "selected-like" },
        { value: "Finde ich super", label: "Finde ich super", activeClass: "selected-super" }
      ];

      configs.forEach((cfg) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "rate-btn";
        if (currentRating === cfg.value) {
          btn.classList.add(cfg.activeClass);
        }
        btn.textContent = cfg.label;
        btn.addEventListener("click", () => onSelect(cfg.value));
        group.append(btn);
      });

      return group;
    }

    function renderRecommendations(recs) {
      aiRecommendations.innerHTML = "";
      if (!Array.isArray(recs) || recs.length === 0) return;

      const grouped = new Map();
      for (const rec of recs) {
        const clusterName = stripMarkdown(rec.cluster || "Passende Vorschläge");
        if (!grouped.has(clusterName)) grouped.set(clusterName, []);
        grouped.get(clusterName).push(rec);
      }

      for (const [clusterName, groupItems] of grouped.entries()) {
        const heading = document.createElement("div");
        heading.className = "cluster-title";
        heading.textContent = clusterName;
        aiRecommendations.append(heading);

        for (const rec of groupItems) {
          const title = stripMarkdown(rec.title || "Unbekannter Titel");
          const year = rec.year ? ` (${escapeHtml(rec.year)})` : "";
          const provider = normalizeProvider(rec.provider);
          const runtime = rec.runtime ? `${escapeHtml(rec.runtime)}` : "";
          const reason = stripMarkdown(rec.reason || "");
          let chosenRating = null;

          const card = document.createElement("div");
          card.className = "rec-card";

          const head = document.createElement("div");
          head.className = "rec-head";

          const titleWrap = document.createElement("div");
          titleWrap.innerHTML = `<strong>${escapeHtml(title)}</strong>${year}<span class="provider-pill">${escapeHtml(provider)}</span>`;

          const addBtn = document.createElement("button");
          addBtn.type = "button";
          addBtn.className = "secondary";
          addBtn.textContent = "+ Merkliste";
          addBtn.addEventListener("click", () => {
            addToWatchlist(title, provider, chosenRating);
            addBtn.textContent = "Gespeichert";
            addBtn.className = "success";
            addBtn.disabled = true;
          });

          head.append(titleWrap, addBtn);

          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = runtime ? `Laufzeit: ${runtime}` : "";

          const body = document.createElement("div");
          body.textContent = reason;

          const rateRow = createRatingControls(chosenRating, (val) => {
            chosenRating = chosenRating === val ? null : val;
            const updatedRow = createRatingControls(chosenRating, (nextVal) => {
              chosenRating = chosenRating === nextVal ? null : nextVal;
            });
            rateRow.replaceWith(updatedRow);
          });

          card.append(head);
          if (runtime) card.append(meta);
          if (reason) card.append(body);
          card.append(rateRow);
          aiRecommendations.append(card);
        }
      }
    }

    function parseRecommendationsJson(rawText) {
      const cleaned = String(rawText)
        .replace(/^```json\s*/i, "")
        .replace(/^```\s*/i, "")
        .replace(/\s*```$/i, "")
        .trim();
      const parsed = JSON.parse(cleaned);
      if (Array.isArray(parsed)) return parsed;
      if (Array.isArray(parsed?.recommendations)) return parsed.recommendations;
      return null;
    }

    function parseApiResponseText(rawBody, httpStatus) {
      const trimmed = String(rawBody || "").trim();
      if (!trimmed) {
        throw new Error(`Leere Antwort (HTTP ${httpStatus})`);
      }
      if (trimmed.startsWith("<")) {
        const snippet = trimmed.replace(/\s+/g, " ").slice(0, 120);
        throw new Error(`Server lieferte HTML statt JSON (HTTP ${httpStatus}): ${snippet}`);
      }
      try {
        return JSON.parse(trimmed);
      } catch {
        const snippet = trimmed.replace(/\s+/g, " ").slice(0, 120);
        throw new Error(`Ungültiges JSON (HTTP ${httpStatus}): ${snippet}`);
      }
    }

    function renderList() {
      const selectedProvider = providerFilter.value;
      const selectedStatus = statusFilter.value;
      const selectedRating = ratingFilter.value;

      const filtered = items.filter((item) => {
        const providerMatch = selectedProvider === "Alle" || item.provider === selectedProvider;
        const statusMatch = selectedStatus === "Alle" || item.status === selectedStatus;
        let ratingMatch = true;
        if (selectedRating === "Ohne Bewertung") {
          ratingMatch = !item.rating;
        } else if (selectedRating !== "Alle") {
          ratingMatch = item.rating === selectedRating;
        }
        return providerMatch && statusMatch && ratingMatch;
      });

      watchlistContainer.innerHTML = "";
      if (filtered.length === 0) {
        watchlistContainer.innerHTML = '<div class="meta">Keine Einträge für den gewählten Filter vorhanden.</div>';
        return;
      }

      filtered.forEach((item) => {
        const providerName = PROVIDERS.includes(item.provider) ? item.provider : "Sonstiges";
        const currentStatus = STATUSES.includes(item.status) ? item.status : "Geplant";
        const currentRating = RATINGS.includes(item.rating) ? item.rating : null;

        const div = document.createElement("div");
        div.className = "item";

        const info = document.createElement("div");
        const ratingBadge = currentRating
          ? `<span class="rating-pill">${escapeHtml(currentRating)}</span>`
          : "";
        info.innerHTML = `
          <div>
            <strong>${escapeHtml(item.title)}</strong>
            <span class="provider-pill">${escapeHtml(providerName)}</span>
            ${ratingBadge}
          </div>
          <div class="meta">Status: ${escapeHtml(currentStatus)}</div>
        `;

        const ratingControls = createRatingControls(currentRating, (nextRating) => {
          setItemRating(item, nextRating);
        });

        const actions = document.createElement("div");
        actions.className = "actions";

        const nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.className = "secondary";
        nextBtn.textContent = "Status wechseln";
        nextBtn.addEventListener("click", () => {
          const next = STATUSES[(STATUSES.indexOf(currentStatus) + 1) % STATUSES.length];
          item.status = next;
          saveItems();
          renderList();
        });

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "danger";
        delBtn.textContent = "Löschen";
        delBtn.addEventListener("click", () => {
          items = items.filter((entry) => entry.id !== item.id);
          saveItems();
          renderList();
        });

        actions.append(ratingControls, nextBtn, delBtn);
        div.append(info, actions);
        watchlistContainer.append(div);
      });
    }

    addForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const title = titleInput.value.trim();
      if (!title) return;
      items.unshift({
        id: crypto.randomUUID(),
        title,
        provider: providerInput.value,
        status: statusInput.value,
        rating: null
      });
      saveItems();
      renderList();
      titleInput.value = "";
      titleInput.focus();
    });

    providerFilter.addEventListener("change", renderList);
    statusFilter.addEventListener("change", renderList);
    ratingFilter.addEventListener("change", renderList);

    saveKeyBtn.addEventListener("click", () => {
      const val = apiKeyInput.value.trim();
      if (!val) return;
      localStorage.setItem(API_KEY_STORAGE, val);
      apiKeyInput.value = "";
      updateApiBadge();
      aiStatus.textContent = "API-Key lokal gespeichert. Du kannst jetzt eine Empfehlung anfordern.";
    });

    clearKeyBtn.addEventListener("click", () => {
      localStorage.removeItem(API_KEY_STORAGE);
      apiKeyInput.value = "";
      updateApiBadge();
      aiStatus.textContent = "Gespeicherter API-Key entfernt.";
      aiRecommendations.innerHTML = "";
    });

    recommendBtn.addEventListener("click", async () => {
      const key = getApiKey();
      const mood = moodInput.value.trim() || "abwechslungsreich";
      const titles = items
        .map((i) => `${i.title} [${i.provider || "Sonstiges"}, ${i.status}${i.rating ? `, Bewertung: ${i.rating}` : ""}]`)
        .join(", ");

      if (!key) {
        aiStatus.textContent = `Demo-Hinweis: Für die Merkliste (${titles || "leer"}) wäre ein guter nächster Titel im Bereich „${mood}“ ein passender Film oder eine Serie mit starker Atmosphäre. Für echte Gemini-Antworten bitte oben unter „Daten & API“ einen Key speichern.`;
        return;
      }

      aiStatus.textContent = "Frage Gemini an...";
      aiRecommendations.innerHTML = "";

      const promptText = [
        "Du bist ein hilfreicher Watchlist-Kurator.",
        `Aktuelle Merkliste (inkl. Bewertungen): ${titles || "keine Einträge"}.`,
        "Bevorzuge Stil und Tonfall von Titeln mit 'Finde ich super', beziehe 'Gefällt mir' positiv ein und meide Ähnliches zu 'Nicht gefällt mir'.",
        `Wunsch/Stimmung: ${mood}.`,
        "Gib auf Deutsch 3 bis 4 konkrete Empfehlungen als reines JSON-Array (ohne Markdown-Codeblöcke) mit diesen Feldern:",
        '[{"cluster":"Gruppenname z.B. Passgenau & straff","title":"Titel","year":"Jahr","runtime":"z.B. 113 Min.","provider":"Einer aus: Sky, Netflix, ARD, ZDF, Tresat, Joyn, Netzkino, Prime Video, HBO Max, Apple TV, Rakuten TV, Sonstiges","reason":"1 kurzer Satz Begründung"}]'
      ].join(" ");

      let lastError = null;

      for (const model of GEMINI_MODELS) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);

        try {
          const res = await fetch(
            `[https://generativelanguage.googleapis.com/v1beta/models/$](https://generativelanguage.googleapis.com/v1beta/models/$){model}:generateContent?key=${encodeURIComponent(key)}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              signal: controller.signal,
              body: JSON.stringify({
                contents: [{
                  parts: [{ text: promptText }]
                }],
                generationConfig: {
                  thinkingConfig: {
                    thinkingBudget: 0
                  }
                }
              })
            }
          );
          const rawBody = await res.text();
          const data = parseApiResponseText(rawBody, res.status);
          if (!res.ok) {
            throw new Error(data?.error?.message || `HTTP ${res.status}`);
          }
          const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
          try {
            const parsedRecs = parseRecommendationsJson(rawText);
            if (parsedRecs) {
              aiStatus.textContent = `Vorschläge gruppiert nach Clustern (Modell: ${model}):`;
              renderRecommendations(parsedRecs);
            } else {
              aiStatus.textContent = stripMarkdown(rawText) || "Keine Antwort erhalten.";
            }
          } catch {
            aiStatus.textContent = stripMarkdown(rawText) || "Keine Antwort erhalten.";
          }
          clearTimeout(timeoutId);
          return;
        } catch (err) {
          lastError = err;
          const isOverloaded = /high demand|overloaded|503|429|UNAVAILABLE/i.test(err.message || "");
          if (!isOverloaded && err.name !== "AbortError") {
            clearTimeout(timeoutId);
            aiStatus.textContent = `Fehler bei der Gemini-Anfrage: ${err.message}`;
            return;
          }
        } finally {
          clearTimeout(timeoutId);
        }
      }

      if (lastError?.name === "AbortError") {
        aiStatus.textContent = "Zeitüberschreitung: Gemini hat nach 30 Sekunden nicht geantwortet.";
      } else {
        aiStatus.textContent = `Fehler bei der Gemini-Anfrage: ${lastError?.message || "Alle Modelle aktuell ausgelastet."}`;
      }
    });

    updateApiBadge();
    renderList();
  </script>
</body>
</html>

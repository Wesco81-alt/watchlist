<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watchlist-Kurator</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #181b24;
      --surface-2: #222634;
      --text: #f3f5f8;
      --muted: #9aa2b4;
      --accent: #4f8cff;
      --accent-soft: rgba(79, 140, 255, 0.16);
      --ok: #2ecc71;
      --bad: #ff5c77;
      --border: rgba(255, 255, 255, 0.08);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-bottom: 84px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15, 17, 23, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    header h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .badge-status {
      font-size: 0.75rem;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .badge-status.live {
      color: var(--ok);
      border-color: rgba(46, 204, 113, 0.35);
      background: rgba(46, 204, 113, 0.12);
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px;
    }

    .view { display: none; }
    .view.active { display: block; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    label {
      font-size: 0.85rem;
      color: var(--muted);
    }

    input[type="text"],
    input[type="password"],
    select,
    textarea {
      width: 100%;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      font-family: inherit;
    }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    button {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 13px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.small {
      padding: 6px 10px;
      font-size: 0.8rem;
    }

    button.active-chip {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #bcd4ff;
    }

    button.vote-up.active {
      background: rgba(46, 204, 113, 0.18);
      border-color: var(--ok);
      color: var(--ok);
    }

    button.vote-down.active {
      background: rgba(255, 92, 119, 0.18);
      border-color: var(--bad);
      color: var(--bad);
    }

    .title-line {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;

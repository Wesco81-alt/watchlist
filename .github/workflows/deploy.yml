name: Deploy Watchlist-Kurator to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build with cache-busting build tag
        id: build_meta
        env:
          BUILD_ID: "${{ github.sha }}"
        run: |
          mkdir -p dist
          cp index.html styles.css app.js dist/
          for f in gemini.js recommendation-rating.js tmdb.js store.js tmdb-store-bridge.js; do
            if [ -f "$f" ]; then
              cp "$f" dist/
            fi
          done

          SHORT_SHA="${GITHUB_SHA::7}"
          STAMP="$(date -u +'%Y-%m-%d %H:%M UTC')"
          TAG_ID="${SHORT_SHA}-$(date -u +%Y%m%d%H%M)"
          TAG_LABEL="v1.5.0 (${SHORT_SHA}, ${STAMP})"

          TAG_ID="$TAG_ID" TAG_LABEL="$TAG_LABEL" node -e '
            const fs = require("fs");
            const tagId = process.env.TAG_ID;
            const tagLabel = process.env.TAG_LABEL;

            let html = fs.readFileSync("dist/index.html", "utf8");
            html = html.replace(/\?v=[^"'\'']*/g, "?v=" + tagId);
            fs.writeFileSync("dist/index.html", html, "utf8");

            let appJs = fs.readFileSync("dist/app.js", "utf8");
            const updated = appJs.replace(
              /const\s+APP_VERSION\s*=\s*["'\''][^"'\'']*["'\'']\s*;/,
              `const APP_VERSION = "${tagLabel}";`
            );
            if (updated === appJs) {
              throw new Error("APP_VERSION Platzhalter in dist/app.js nicht gefunden!");
            }
            fs.writeFileSync("dist/app.js", updated, "utf8");
          '

          echo "Gesetzte Version: ${TAG_LABEL}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

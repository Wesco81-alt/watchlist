name: Deploy Watchlist-Kurator to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build with cache-busting build tag
        id: build_meta
        run: |
          mkdir -p dist
          cp index.html styles.css app.js dist/
          if [ -f gemini.js ]; then
            cp gemini.js dist/
          fi

          BUILD_ID="${GITHUB_SHA::7}-$(date -u +%Y%m%d%H%M)"
          BUILD_LABEL="Build ${GITHUB_SHA::7} · $(date -u +'%Y-%m-%d %H:%M UTC')"

          sed -i "s/?v=[^\"']*/?v=${BUILD_ID}/g" dist/index.html
          sed -i -E "s|const APP_VERSION = [^;]+;|const APP_VERSION = \"${BUILD_LABEL}\";|" dist/app.js

          echo "build_label=${BUILD_LABEL}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
